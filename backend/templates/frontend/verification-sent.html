<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Sent - UPTORPS</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-page="verification-sent">
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-left-content">
                <div class="logo">
                    <div class="logo-icon">🎓</div>
                    <span>UPTORPS</span>
                </div>
                <h1>Almost there.</h1>
                <p>Check your inbox to verify your account and complete your profile.</p>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-form-container">
                <div class="success-message" id="verification-message">A verification email has been sent.</div>
                <h2>Check your email</h2>
                <p>We sent a confirmation link to <strong id="user-email">your email</strong>.</p>
                <p>Once verified, you can sign in and continue learning.</p>
                <a href="/login.html" class="btn btn-primary" style="display: inline-block; text-align: center; text-decoration: none; margin-top: 1rem;">Go to Sign In</a>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
