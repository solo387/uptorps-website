services:
  - type: web
    name: uptorps-web
    env: docker
    plan: free
    rootDir: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: uptorps-web.onrender.com
      - key: HOST
        value: https://uptorps-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: uptorps-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: uptorps-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: uptorps-redis
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: EMAIL_HOST
        value: ""
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: ""
      - key: EMAIL_HOST_PASSWORD
        value: ""
      - key: DEFAULT_FROM_EMAIL
        value: Security <no-reply@uptorps.com>

  - type: worker
    name: uptorps-worker
    env: docker
    plan: free
    rootDir: .
    dockerfilePath: ./backend/Dockerfile
    startCommand: celery -A core worker --loglevel=info
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: uptorps-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: uptorps-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: uptorps-redis
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

  - type: worker
    name: uptorps-beat
    env: docker
    plan: free
    rootDir: .
    dockerfilePath: ./backend/Dockerfile
    startCommand: celery -A core beat --loglevel=info
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: uptorps-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: uptorps-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: uptorps-redis
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

  - type: redis
    name: uptorps-redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: uptorps-db
    databaseName: uptorps
    user: uptorps
    plan: free
